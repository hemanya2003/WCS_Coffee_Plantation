<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WCS Coffee Plantation – Map & Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<!-- MapLibre -->
<link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>

<!-- Turf for area calculation -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
html,body{margin:0;padding:0;height:100%;font-family:Segoe UI,Arial}
#map{position:absolute;top:56px;bottom:0;width:100%}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:linear-gradient(90deg,#1b5e20,#2e7d32);
  color:#fff;font-size:20px;font-weight:bold;
  display:flex;align-items:center;padding-left:16px;
  z-index:20;
}

/* DASHBOARD TOGGLE BUTTON */
#dashToggle{
  position:fixed;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  z-index:30;
  width:54px;height:54px;
  border:none;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#ff9800,#4caf50,#2196f3);
  box-shadow:0 6px 14px rgba(0,0,0,0.35);
}

/* DASHBOARD PANEL */
.dashboard{
  position:fixed;
  top:56px;
  right:0;
  width:320px;
  height:calc(100% - 56px);
  background:#ffffff;
  box-shadow:-4px 0 14px rgba(0,0,0,0.3);
  transform:translateX(100%);
  transition:transform 0.35s ease;
  z-index:25;
  overflow-y:auto;
  padding:14px;
}
.dashboard.show{transform:translateX(0)}

.dashboard h3{
  margin:10px 0 8px;
  color:#1b5e20;
  font-size:16px;
}
.card{
  background:#f4f6f4;
  padding:8px 10px;
  border-radius:6px;
  margin-bottom:8px;
  font-size:14px;
}
.card span{font-weight:bold;color:#2e7d32}

.assumptions label{
  display:block;
  font-size:13px;
  margin-top:8px;
}
.assumptions input{width:100%}

@media(max-width:768px){
  .dashboard{width:100%}
}
</style>
</head>

<body>

<header>☕ WCS Coffee Plantation – Interactive Map</header>
<div id="map"></div>

<!-- Dashboard Toggle -->
<button id="dashToggle" onclick="toggleDashboard()">📊</button>

<!-- Dashboard Panel -->
<div class="dashboard">
  <h3>📍 Plantation Snapshot</h3>
  <div class="card">Villages: <span id="villages">–</span></div>
  <div class="card">Plots: <span id="plots">–</span></div>
  <div class="card">Coffee Area: <span id="coffeeArea">–</span> Acres</div>

  <h3>💰 Financial Snapshot</h3>
  <div class="card">Revenue: <span id="revenue">–</span></div>
  <div class="card">Cost: <span id="cost">–</span></div>
  <div class="card">Net Margin: <span id="profit">–</span></div>

  <h3>🎛️ Assumptions (Editable)</h3>
  <div class="assumptions">
    <label>Yield (kg / ha)
      <input type="range" min="600" max="1400" step="50" value="900" id="yield">
    </label>
    <label>Price (₹ / kg)
      <input type="number" value="210" id="price">
    </label>
    <label>Cost (₹ / ha)
      <input type="number" value="110000" id="costHa">
    </label>
  </div>
</div>

<script>
/* ================= MAP ================= */
const map = new maplibregl.Map({
  container:'map',
  style:'https://api.maptiler.com/maps/streets-v4/style.json?key=E6ZRsLot4eQsQImxowwm',
  center:[82.9,18.7],
  zoom:11,
  pitch:45
});
map.addControl(new maplibregl.NavigationControl());

function toggleDashboard(){
  document.querySelector('.dashboard').classList.toggle('show');
}

/* ================= DATA ================= */
let coffeeAreaAc = 0;
let villageSet = new Set();

/* Village */
fetch('https://raw.githubusercontent.com/hemanya2003/WCS_Coffee_Plantation/main/VillageBoundary.geojson')
.then(r=>r.json())
.then(g=>{
  g.features.forEach(f=>villageSet.add(f.properties.VILL_NAME));
  document.getElementById('villages').innerText = villageSet.size;
});

/* Plot count */
fetch('https://raw.githubusercontent.com/hemanya2003/WCS_Coffee_Plantation/main/Plotboundary.geojson')
.then(r=>r.json())
.then(g=>{
  document.getElementById('plots').innerText = g.features.length;
});

/* Coffee area from COFFEE PLOTS ONLY */
fetch('https://raw.githubusercontent.com/hemanya2003/WCS_Coffee_Plantation/main/WCS_CoffePlantation.geojson')
.then(r=>r.json())
.then(g=>{
  g.features.forEach(f=>{
    const sqm = turf.area(f);
    coffeeAreaAc += sqm * 0.000247105; // sqm → acres
  });
  document.getElementById('coffeeArea').innerText = coffeeAreaAc.toFixed(2);
  calculateFinance();
});

/* ================= FINANCE ================= */
document.querySelectorAll('#yield,#price,#costHa')
.forEach(i=>i.addEventListener('input',calculateFinance));

function calculateFinance(){
  if(coffeeAreaAc === 0) return;

  const ha = coffeeAreaAc * 0.404686;
  const yieldKg = Number(document.getElementById('yield').value);
  const price = Number(document.getElementById('price').value);
  const costHa = Number(document.getElementById('costHa').value);

  const revenue = ha * yieldKg * price;
  const cost = ha * costHa;
  const profit = revenue - cost;

  document.getElementById('revenue').innerText = '₹' + (revenue/1e7).toFixed(2) + ' Cr';
  document.getElementById('cost').innerText = '₹' + (cost/1e7).toFixed(2) + ' Cr';
  document.getElementById('profit').innerText = '₹' + (profit/1e7).toFixed(2) + ' Cr';
}
</script>

</body>
</html>
