<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WCS Coffee Plantation – Financial Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
html,body{margin:0;padding:0;height:100%;font-family:Segoe UI,Arial}
#map{position:absolute;top:56px;bottom:0;width:100%}

header{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:linear-gradient(90deg,#1b5e20,#2e7d32);
  color:#fff;font-size:20px;font-weight:bold;
  display:flex;align-items:center;padding-left:16px;
  z-index:20;
}

/* DASHBOARD */
.dashboard{
  position:fixed;
  top:70px;
  right:10px;
  width:280px;
  background:#fff;
  padding:14px;
  border-radius:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  font-size:14px;
  z-index:10;
}
.dashboard h3{
  margin:6px 0 8px;
  color:#1b5e20;
  font-size:16px;
}
.card{
  background:#f6f8f6;
  padding:8px 10px;
  border-radius:6px;
  margin-bottom:8px;
}
.card span{font-weight:bold;color:#2e7d32}

/* ASSUMPTIONS */
.assumptions label{
  display:block;
  font-size:13px;
  margin-top:6px;
}
.assumptions input{
  width:100%;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  border:none;
  background:#1b5e20;
  color:#fff;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .dashboard{
    width:100%;
    right:0;
    bottom:0;
    top:auto;
    border-radius:14px 14px 0 0;
  }
}
</style>
</head>

<body>

<header>☕ WCS Coffee Plantation – Financial Dashboard</header>
<div id="map"></div>

<div class="dashboard">
  <h3>📍 Plantation Snapshot</h3>
  <div class="card">Villages: <span id="villages">–</span></div>
  <div class="card">Plots: <span id="plots">–</span></div>
  <div class="card">Total Area: <span id="area">–</span> Acres</div>
  <div class="card">Coffee Area: <span id="coffeeArea">–</span> Acres</div>

  <h3>💰 Financial Snapshot</h3>
  <div class="card">Revenue: <span id="revenue">–</span></div>
  <div class="card">Cost: <span id="cost">–</span></div>
  <div class="card">Net Margin: <span id="profit">–</span></div>

  <h3>🎛️ Assumptions</h3>
  <div class="assumptions">
    <label>Yield (kg / ha)
      <input type="range" min="600" max="1400" step="50" value="900" id="yield">
    </label>
    <label>Price (₹ / kg)
      <input type="number" value="210" id="price">
    </label>
    <label>Cost (₹ / ha)
      <input type="number" value="110000" id="costHa">
    </label>
  </div>

  <br>
  <button onclick="exportPDF()">📄 Download PDF</button>
</div>

<script>
const map = new maplibregl.Map({
  container:'map',
  style:'https://api.maptiler.com/maps/streets-v4/style.json?key=E6ZRsLot4eQsQImxowwm',
  center:[82.9,18.7],
  zoom:11
});
map.addControl(new maplibregl.NavigationControl());

let totalAreaAc=0;
let villagesSet=new Set();

Promise.all([
  fetch('https://raw.githubusercontent.com/hemanya2003/WCS_Coffee_Plantation/main/Plotboundary.geojson').then(r=>r.json()),
  fetch('https://raw.githubusercontent.com/hemanya2003/WCS_Coffee_Plantation/main/VillageBoundary.geojson').then(r=>r.json())
]).then(([plots,villages])=>{

  document.getElementById('plots').innerText = plots.features.length;

  plots.features.forEach(f=>{
    totalAreaAc += Number(f.properties.AREA_ACRE || 0);
  });

  villages.features.forEach(v=>{
    villagesSet.add(v.properties.VILL_NAME);
  });

  document.getElementById('villages').innerText = villagesSet.size;
  document.getElementById('area').innerText = totalAreaAc.toFixed(2);

  // Assume 89% coffee coverage
  const coffeeAc = totalAreaAc * 0.89;
  document.getElementById('coffeeArea').innerText = coffeeAc.toFixed(2);

  calculateFinance();
});

document.querySelectorAll('#yield,#price,#costHa')
  .forEach(i=>i.addEventListener('input',calculateFinance));

function calculateFinance(){
  const coffeeAc = Number(document.getElementById('coffeeArea').innerText);
  const ha = coffeeAc * 0.404686;

  const yieldKg = Number(document.getElementById('yield').value);
  const price = Number(document.getElementById('price').value);
  const costHa = Number(document.getElementById('costHa').value);

  const revenue = ha * yieldKg * price;
  const cost = ha * costHa;
  const profit = revenue - cost;

  document.getElementById('revenue').innerText = '₹' + (revenue/1e7).toFixed(2) + ' Cr';
  document.getElementById('cost').innerText = '₹' + (cost/1e7).toFixed(2) + ' Cr';
  document.getElementById('profit').innerText = '₹' + (profit/1e7).toFixed(2) + ' Cr';
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  pdf.setFontSize(16);
  pdf.text('WCS Coffee Plantation – Financial Summary',10,15);

  pdf.setFontSize(12);
  pdf.text(`Villages: ${villagesSet.size}`,10,30);
  pdf.text(`Plots: ${document.getElementById('plots').innerText}`,10,38);
  pdf.text(`Total Area: ${totalAreaAc.toFixed(2)} Acres`,10,46);

  pdf.text(`Revenue: ${document.getElementById('revenue').innerText}`,10,62);
  pdf.text(`Cost: ${document.getElementById('cost').innerText}`,10,70);
  pdf.text(`Net Margin: ${document.getElementById('profit').innerText}`,10,78);

  pdf.text('Note: Figures are indicative estimates based on GIS area and standard benchmarks.',10,100);

  pdf.save('WCS_Coffee_Financial_Report.pdf');
}
</script>

</body>
</html>
